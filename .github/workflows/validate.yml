name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies with npm@11.20.0
        run: npx --yes npm@11.20.0 ci --ignore-scripts
      - name: Validate template
        shell: bash
        run: |
          if [ -f template.json ]; then
            npm run validate:template
          else
            npm run validate:template -- --scaffolded
          fi
      - name: Check formatting
        run: npm run format:check
      - name: Lint and typecheck
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
